[project]
name = "interview-review"
version = "0.1.0"
description = "Interview integrity review: evidence-based second-look flags for recruiters"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "httpx>=0.27",
  "pypdf>=4.0",
  "openai>=1.60",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
firebase = ["firebase-admin>=6.5"]
dev = ["pytest>=8.0"]

[project.scripts]
interview-review = "interview_review.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
